<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>同心圓 3D 迷宮 RPG</title>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }

        /* 2D 小地圖 */
        #minimap-card {
            position: absolute; top: 10px; right: 10px;
            width: 120px; height: 120px;
            background: rgba(15, 23, 42, 0.85);
            border: 2px solid #38bdf8; border-radius: 50%;
            overflow: hidden; pointer-events: none;
        }
        #minimap-canvas { width: 100%; height: 100%; }

        /* 虛擬搖桿 (手機端) */
        .joystick-zone {
            position: absolute; bottom: 20px; width: 120px; height: 120px;
            background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; touch-action: none; display: flex;
            justify-content: center; align-items: center;
        }
        #move-joy { left: 20px; }
        #look-joy { right: 20px; }
        .stick {
            width: 50px; height: 50px; background: rgba(56, 189, 248, 0.6);
            border-radius: 50%; position: absolute; pointer-events: none;
        }

        /* 下方 HUD 鑰匙欄 */
        #status-bar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 10px; background: rgba(0,0,0,0.6); padding: 6px 16px;
            border-radius: 20px; border: 1px solid #555; pointer-events: none;
        }
        .key-slot { display: flex; flex-direction: column; align-items: center; opacity: 0.3; }
        .key-slot.active { opacity: 1; }
        .key-icon { width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #000; font-size: 12px; }
        .key-count { color: #fff; font-size: 10px; }

        .c-國 { background-color: #ff4d4d; }
        .c-英 { background-color: #ff944d; }
        .c-數 { background-color: #ffdb4d; }
        .c-社 { background-color: #4dff4d; }
        .c-自 { background-color: #4dabff; }

        /* 彈出視窗 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .overlay.show { display: flex; }
        .popup-card { background: #1e293b; color: #fff; padding: 20px; border-radius: 12px; width: 90%; max-width: 400px; text-align: center; border: 2px solid #38bdf8; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 12px; }
        .opt-btn { background: #334155; color: #fff; border: 1fr solid #64748b; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <!-- 右上角圓形小地圖 -->
    <div id="minimap-card">
        <canvas id="minimap-canvas" width="120" height="120"></canvas>
    </div>

    <!-- 手機虛擬搖桿 -->
    <div id="move-joy" class="joystick-zone"><div class="stick" id="move-stick"></div></div>
    <div id="look-joy" class="joystick-zone"><div class="stick" id="look-stick"></div></div>

    <!-- 鑰匙 HUD -->
    <div id="status-bar">
        <div class="key-slot" id="hud-國"><div class="key-icon c-國">國</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-英"><div class="key-icon c-英">英</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-數"><div class="key-icon c-數">數</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-社"><div class="key-icon c-社">社</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-自"><div class="key-icon c-自">自</div><div class="key-count">x0</div></div>
    </div>

    <!-- 題目彈窗 -->
    <div class="overlay" id="quiz-popup">
        <div class="popup-card">
            <h3 id="quiz-title" style="margin:0;">題目</h3>
            <p id="quiz-text" style="text-align:left; line-height:1.4;"></p>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>

    <!-- 訊息視窗 -->
    <div class="overlay" id="msg-popup">
        <div class="popup-card">
            <h3 id="msg-title">情報</h3>
            <p id="msg-body" style="line-height:1.5;"></p>
            <button onclick="closeOverlay('msg-popup')" style="padding:8px 20px; background:#38bdf8; border:none; border-radius:4px; font-weight:bold;">確定</button>
        </div>
    </div>

    <!-- 通關認證書 -->
    <div class="overlay" id="cert-popup">
        <div class="popup-card" style="border-color:gold;">
            <h2 style="color:gold; margin:0;">圓形迷宮大師！</h2>
            <p>恭喜成功從最外圍穿過層層岔路進入中央傳送門！</p>
            <button onclick="location.reload()" style="padding:10px 24px; background:gold; border:none; font-weight:bold; cursor:pointer;">重新挑戰</button>
        </div>
    </div>

    <script>
        // --- 1. 遊戲資料 ---
        const subList = ['國', '英', '數', '社', '自'];
        const subColorsHex = { '國': 0xff4d4d, '英': 0xff944d, '數': 0xffdb4d, '社': 0x4dff4d, '自': 0x4dabff };
        const subColorsCss = { '國': '#ff4d4d', '英': '#ff944d', '數': '#ffdb4d', '社': '#4dff4d', '自': '#4dabff' };

        const quizBank = {
            '國': [{ q: "「沉魚落雁」常用來形容女子的什麼？", o: ["A. 武藝超群", "B. 容貌極美", "C. 歌聲動聽"], a: 1 }],
            '英': [{ q: "She _______ to school every day.", o: ["A. go", "B. goes", "C. going"], a: 1 }],
            '數': [{ q: "解方程式：2x + 6 = 14，則 x = ?", o: ["A. 3", "B. 4", "C. 5"], a: 1 }],
            '社': [{ q: "台灣主要位於哪兩個板塊交界處？", o: ["A. 歐亞與菲律賓海板塊", "B. 太平洋與美洲板塊"], a: 0 }],
            '自': [{ q: "下列何者屬於「物理變化」？", o: ["A. 光合作用", "B. 水結成冰", "C. 木材燃燒"], a: 1 }]
        };

        let gameState = { keysLit: {}, keyCounts: { '國':0,'英':0,'數':0,'社':0,'自':0 }, nearCooldown: false };
        subList.forEach(s => gameState.keysLit[s] = false);

        // --- 2. 3D 場景 setup (高亮度) ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0f172a); // 明亮的深藍天色

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 環境光大幅加亮 (0.75)
        scene.add(new THREE.AmbientLight(0xffffff, 0.75));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.4);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 地板
        const floorGeo = new THREE.CircleGeometry(40, 64);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x1e293b });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1.5;
        scene.add(floor);

        // --- 3. 生成圓形迷宮 (3 層同心圓牆壁) ---
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.6 });
        const wallRadius = [10, 20, 30]; // 內、中、外 3 環
        const walls = [];

        // 創建帶缺口(岔路口)的圓形牆壁
        wallRadius.forEach((r, ringIdx) => {
            const segments = 32;
            const step = (Math.PI * 2) / segments;
            // 隨機設置 2~3 個岔路缺口
            const gaps = [(ringIdx * 3 + 2) % segments, (ringIdx * 5 + 10) % segments];

            for (let i = 0; i < segments; i++) {
                if (gaps.includes(i)) continue; // 岔路口不建牆
                const angle = i * step;
                const nextAngle = (i + 1) * step;
                
                const wallGeo = new THREE.BoxGeometry(0.6, 3.5, (2 * Math.PI * r) / segments);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                
                const midAngle = (angle + nextAngle) / 2;
                wall.position.set(Math.cos(midAngle) * r, 0, Math.sin(midAngle) * r);
                wall.rotation.y = -midAngle;
                scene.add(wall);
                walls.push(wall);
            }
        });

        // --- 4. 生成 岔路口題目 (❓ 看板) 與 角落寶箱 (🎁 木箱) ---
        const interactables = [];

        // 在環壁岔路口生成「題目看板 (❓)」
        const quizAngles = [0.5, 2.2, 3.8, 4.8, 5.5];
        subList.forEach((sub, i) => {
            const r = wallRadius[i % 3];
            const ang = quizAngles[i];
            const x = Math.cos(ang) * r;
            const z = Math.sin(ang) * r;

            // 製作 ❓ 板子
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = subColorsCss[sub]; ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 80px sans-serif';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText('?', 64, 64);

            const tex = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: tex });
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 0.2), mat);
            mesh.position.set(x, 0, z);
            mesh.userData = { type: 'Q', sub: sub };
            scene.add(mesh);
            interactables.push(mesh);
        });

        // 寶箱位置隨機且遠離入口 (最外圍角落深處)
        const boxAngles = [1.2, 2.9, 4.1, 5.1, 6.0];
        subList.forEach((sub, i) => {
            const r = wallRadius[i % 3] + (i % 2 === 0 ? 4 : -4); // 擺放於牆壁角落/巷道深處
            const ang = boxAngles[i];
            const x = Math.cos(ang) * r;
            const z = Math.sin(ang) * r;

            // 3D 木箱寶箱
            const boxGeo = new THREE.BoxGeometry(1, 0.8, 0.8);
            const boxMat = new THREE.MeshStandardMaterial({ color: subColorsHex[sub], roughness: 0.4 });
            const mesh = new THREE.Mesh(boxGeo, boxMat);
            mesh.position.set(x, -1.1, z);
            mesh.rotation.y = Math.random() * Math.PI;
            mesh.userData = { type: 'B', sub: sub };
            scene.add(mesh);
            interactables.push(mesh);
        });

        // 中央傳送門 (出口 E)
        const portalGeo = new THREE.CylinderGeometry(2, 2, 4, 16);
        const portalMat = new THREE.MeshBasicMaterial({ color: 0xffd700, transparent: true, opacity: 0.6 });
        const portal = new THREE.Mesh(portalGeo, portalMat);
        portal.position.set(0, 0, 0);
        portal.userData = { type: 'E' };
        scene.add(portal);
        interactables.push(portal);

        // 玩家初始位置：最外圍 (r = 36) 出發，遠離寶箱與出口
        camera.position.set(36, 0, 0);

        // --- 5. 虛擬搖桿與視角操控 ---
        let moveInput = { x: 0, y: 0 };
        let lookInput = { x: 0, y: 0 };
        let yaw = -Math.PI / 2, pitch = 0;

        function setupJoystick(zoneId, stickId, callback) {
            const zone = document.getElementById(zoneId);
            const stick = document.getElementById(stickId);
            let touchId = null, startX = 0, startY = 0;

            zone.addEventListener('touchstart', (e) => {
                if (touchId !== null) return;
                const t = e.changedTouches[0];
                touchId = t.identifier;
                startX = t.clientX; startY = t.clientY;
            });

            window.addEventListener('touchmove', (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        const dx = t.clientX - startX;
                        const dy = t.clientY - startY;
                        const dist = Math.min(Math.hypot(dx, dy), 40);
                        const angle = Math.atan2(dy, dx);
                        const mx = Math.cos(angle) * dist;
                        const my = Math.sin(angle) * dist;
                        stick.style.transform = `translate(${mx}px, ${my}px)`;
                        callback(mx / 40, my / 40);
                    }
                }
            });

            const endHandler = (e) => {
                for (let t of e.changedTouches) {
                    if (t.identifier === touchId) {
                        touchId = null;
                        stick.style.transform = `translate(0px, 0px)`;
                        callback(0, 0);
                    }
                }
            };
            window.addEventListener('touchend', endHandler);
            window.addEventListener('touchcancel', endHandler);
        }

        setupJoystick('move-joy', 'move-stick', (x, y) => { moveInput.x = x; moveInput.y = y; });
        setupJoystick('look-joy', 'look-stick', (x, y) => { lookInput.x = x; lookInput.y = y; });

        // 鍵盤備用控制
        const keys = {};
        document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        // --- 6. 碰撞與「觸碰即答」檢測 ---
        function updatePlayer() {
            if (document.querySelector('.overlay.show')) return;

            // 視角旋轉
            yaw -= lookInput.x * 0.04;
            pitch -= lookInput.y * 0.03;
            pitch = Math.max(-Math.PI/3, Math.min(Math.PI/3, pitch));
            
            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            // 移動計算
            let mx = moveInput.x;
            let my = moveInput.y;
            if (keys['w']) my = -1; if (keys['s']) my = 1;
            if (keys['a']) mx = -1; if (keys['d']) mx = 1;

            const frontDir = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
            const sideDir = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

            const moveVec = new THREE.Vector3()
                .addScaledVector(frontDir, -my)
                .addScaledVector(sideDir, mx)
                .normalize().multiplyScalar(0.12);

            let newPos = camera.position.clone().add(moveVec);

            // 牆壁碰撞
            let collide = false;
            for (let wall of walls) {
                if (new THREE.Box3().setFromObject(wall).intersectsBox(new THREE.Box3().setFromCenterAndSize(newPos, new THREE.Vector3(0.8, 1.8, 0.8)))) {
                    collide = true; break;
                }
            }
            if (!collide) camera.position.copy(newPos);

            // 觸碰即答與開箱觸發 (距離 < 1.2 自動觸發)
            interactables.forEach(mesh => {
                if (camera.position.distanceTo(mesh.position) < 1.3 && !gameState.nearCooldown) {
                    triggerAutoInteraction(mesh);
                }
            });
        }

        function triggerAutoInteraction(mesh) {
            const data = mesh.userData;
            if (data.type === 'Q') {
                gameState.nearCooldown = true;
                const q = quizBank[data.sub][0];
                document.getElementById('quiz-title').textContent = `${data.sub}語文挑戰 (岔路口)`;
                document.getElementById('quiz-title').style.color = subColorsCss[data.sub];
                document.getElementById('quiz-text').textContent = q.q;

                const optsEl = document.getElementById('quiz-options');
                optsEl.innerHTML = '';
                q.o.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn'; btn.textContent = opt;
                    btn.onclick = () => {
                        closeOverlay('quiz-popup');
                        if (idx === q.a) {
                            gameState.keysLit[data.sub] = true;
                            gameState.keyCounts[data.sub]++;
                            updateHUD();
                            scene.remove(mesh); // 答對移除題目
                            showMsg('答對了！', `獲得【${data.sub}鑰匙】！去角落尋找寶箱吧！`);
                        } else {
                            showMsg('答錯了...', '沒關係，請重新走回岔路口試試看！');
                        }
                        setTimeout(() => gameState.nearCooldown = false, 1500);
                    };
                    optsEl.appendChild(btn);
                });
                showOverlay('quiz-popup');

            } else if (data.type === 'B') {
                if (gameState.keyCounts[data.sub] > 0) {
                    gameState.nearCooldown = true;
                    gameState.keyCounts[data.sub]--;
                    updateHUD();
                    scene.remove(mesh);
                    showMsg('自動撞開寶箱！', `📜 <b>秘寶情報：</b><br>獲得自然科解答提示為 B！`);
                    setTimeout(() => gameState.nearCooldown = false, 1500);
                }
            } else if (data.type === 'E') {
                if (subList.every(s => gameState.keysLit[s])) {
                    showOverlay('cert-popup');
                }
            }
        }

        function updateHUD() {
            subList.forEach(s => {
                const slot = document.getElementById(`hud-${s}`);
                if (gameState.keysLit[s]) slot.classList.add('active');
                slot.querySelector('.key-count').textContent = `x${gameState.keyCounts[s]}`;
            });
        }

        function showOverlay(id) { document.getElementById(id).classList.add('show'); }
        function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
        function showMsg(title, body) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-body').innerHTML = body;
            showOverlay('msg-popup');
        }

        // --- 7. 右上角圓形雷達繪製 ---
        const minimapCanvas = document.getElementById('minimap-canvas');
        const mctx = minimapCanvas.getContext('2d');

        function renderMinimap() {
            mctx.clearRect(0,0,120,120);
            const cx = 60, cy = 60, scale = 1.3;

            // 繪製圓環牆壁
            mctx.strokeStyle = '#334155'; mctx.lineWidth = 3;
            wallRadius.forEach(r => {
                mctx.beginPath();
                mctx.arc(cx, cy, r * scale, 0, Math.PI * 2);
                mctx.stroke();
            });

            // 繪製玩家與朝向
            const px = cx + camera.position.x * scale;
            const py = cy + camera.position.z * scale;
            mctx.fillStyle = '#38bdf8';
            mctx.beginPath(); mctx.arc(px, py, 4, 0, Math.PI*2); mctx.fill();

            mctx.strokeStyle = '#67e8f9'; mctx.lineWidth = 2;
            mctx.beginPath(); mctx.moveTo(px, py);
            mctx.lineTo(px - Math.sin(yaw)*8, py - Math.cos(yaw)*8);
            mctx.stroke();
        }

        // --- 8. 主 Loop ---
        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderMinimap();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
