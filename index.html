<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>歡樂園遊會 3D 迷宮 (不頭暈版)</title>
    <style>
        * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
        html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* 頂部輕量化標題 */
        #header-banner {
            position: absolute; top: 8px; left: 12px; z-index: 10;
            background: rgba(255, 71, 87, 0.9); color: #fff; padding: 4px 12px;
            border-radius: 12px; font-weight: bold; font-size: 13px; border: 2px solid #fff;
            pointer-events: none;
        }

        /* 右上角小地圖 */
        #minimap-card {
            position: absolute; top: 8px; right: 8px; z-index: 10;
            width: 80px; height: 80px; background: rgba(255, 255, 255, 0.85);
            border: 2px solid #f1c40f; border-radius: 50%; overflow: hidden; pointer-events: none;
        }
        #minimap-canvas { width: 100%; height: 100%; }

        /* 下方集章卡 */
        #status-bar {
            position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 10;
            display: flex; gap: 6px; background: rgba(255, 255, 255, 0.9); padding: 4px 10px;
            border-radius: 20px; border: 2px solid #ffbe76; pointer-events: none;
        }
        .key-slot { display: flex; flex-direction: column; align-items: center; opacity: 0.3; }
        .key-slot.active { opacity: 1; }
        .key-icon { width: 20px; height: 20px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: #fff; font-size: 11px; }
        .key-count { color: #333; font-size: 9px; font-weight: bold; }

        .c-國 { background-color: #ff4757; }
        .c-英 { background-color: #ffa502; }
        .c-數 { background-color: #2ed573; }
        .c-社 { background-color: #1e90ff; }
        .c-自 { background-color: #9b59b6; }

        /* 手機按鍵控制區 (簡化不占空間) */
        #mobile-controls {
            position: absolute; bottom: 15px; left: 0; width: 100%; z-index: 10;
            display: flex; justify-content: space-between; padding: 0 20px;
            pointer-events: none;
        }
        .btn-group { display: flex; gap: 10px; pointer-events: auto; }
        .ctrl-btn {
            width: 55px; height: 55px; background: rgba(255, 255, 255, 0.85);
            border: 2px solid #ff4757; border-radius: 50%; font-size: 20px; font-weight: bold;
            color: #2f3542; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); touch-action: manipulation;
        }
        .ctrl-btn:active { background: #ff7f50; color: #fff; }

        /* 彈窗 */
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .overlay.show { display: flex; }
        .popup-card { background: #fff; color: #333; padding: 16px; border-radius: 16px; width: 85%; max-width: 340px; text-align: center; border: 3px solid #ff7f50; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 10px; }
        .opt-btn { background: #f1f2f6; color: #333; border: 1px solid #ddd; padding: 10px; border-radius: 8px; font-weight: bold; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="header-banner">🎪 歡樂園遊會</div>

    <div id="minimap-card">
        <canvas id="minimap-canvas" width="80" height="80"></canvas>
    </div>

    <div id="status-bar">
        <div class="key-slot" id="hud-國"><div class="key-icon c-國">國</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-英"><div class="key-icon c-英">英</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-數"><div class="key-icon c-數">數</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-社"><div class="key-icon c-社">社</div><div class="key-count">x0</div></div>
        <div class="key-slot" id="hud-自"><div class="key-icon c-自">自</div><div class="key-count">x0</div></div>
    </div>

    <!-- 手機按鈕 (前/後/左轉/右轉) -->
    <div id="mobile-controls">
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-left">◀</div>
            <div class="ctrl-btn" id="btn-right">▶</div>
        </div>
        <div class="btn-group">
            <div class="ctrl-btn" id="btn-backward">▼</div>
            <div class="ctrl-btn" id="btn-forward">▲</div>
        </div>
    </div>

    <div class="overlay" id="quiz-popup">
        <div class="popup-card">
            <h3 id="quiz-title" style="margin:0;">闖關挑戰</h3>
            <p id="quiz-text" style="text-align:left; font-size:14px; margin: 10px 0;"></p>
            <div class="options-grid" id="quiz-options"></div>
        </div>
    </div>

    <div class="overlay" id="msg-popup">
        <div class="popup-card">
            <h3 id="msg-title" style="color:#ff4757; margin-top:0;">訊息</h3>
            <p id="msg-body" style="font-size:13px;"></p>
            <button onclick="closeOverlay('msg-popup')" style="padding:8px 20px; background:#ff7f50; color:#fff; border:none; border-radius:8px; font-weight:bold;">確定</button>
        </div>
    </div>

    <div class="overlay" id="cert-popup">
        <div class="popup-card" style="border-color:#f1c40f;">
            <h2 style="color:#ffa502; margin:0;">🎉 園遊會通關！</h2>
            <p style="font-size:14px;">恭喜成功走出園遊會圓形迷宮！</p>
            <button onclick="location.reload()" style="padding:10px 20px; background:#2ed573; color:#fff; border:none; border-radius:10px; font-weight:bold;">再玩一次</button>
        </div>
    </div>

    <script>
        const subList = ['國', '英', '數', '社', '自'];
        const subColorsHex = { '國': 0xff4757, '英': 0xffa502, '數': 0x2ed573, '社': 0x1e90ff, '自': 0x9b59b6 };

        const quizBank = {
            '國': [{ q: "「沉魚落雁」常用來形容女子的什麼？", o: ["A. 武藝超群", "B. 容貌極美", "C. 歌聲動聽"], a: 1 }],
            '英': [{ q: "She _______ to school every day.", o: ["A. go", "B. goes", "C. going"], a: 1 }],
            '數': [{ q: "解方程式：2x + 6 = 14，則 x = ?", o: ["A. 3", "B. 4", "C. 5"], a: 1 }],
            '社': [{ q: "台灣主要位於哪兩個板塊交界處？", o: ["A. 歐亞與菲律賓海板塊", "B. 太平洋與美洲板塊"], a: 0 }],
            '自': [{ q: "下列何者屬於「物理變化」？", o: ["A. 光合作用", "B. 水結成冰", "C. 木材燃燒"], a: 1 }]
        };

        let gameState = { keysLit: {}, keyCounts: { '國':0,'英':0,'數':0,'社':0,'自':0 }, nearCooldown: false };
        subList.forEach(s => gameState.keysLit[s] = false);

        // 初始化 3D
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.9));
        const sun = new THREE.DirectionalLight(0xffffff, 0.5);
        sun.position.set(10, 20, 10);
        scene.add(sun);

        // 玩家角色與視角設置
        const playerGroup = new THREE.Group();
        scene.add(playerGroup);

        // 建立可愛小玩家代表（小氣球人）
        const playerBody = new THREE.Mesh(
            new THREE.SphereGeometry(0.5, 16, 16),
            new THREE.MeshStandardMaterial({ color: 0xff4757 })
        );
        playerBody.position.y = 0.5;
        playerGroup.add(playerBody);

        // 相機固定在玩家後上方，防暈眩
        camera.position.set(0, 2.5, 4.5);
        camera.lookAt(0, 0.5, -2);
        playerGroup.add(camera);

        playerGroup.position.set(36, 0, 0);
        playerGroup.rotation.y = -Math.PI / 2; // 起始朝內

        // 草地
        const floor = new THREE.Mesh(
            new THREE.CircleGeometry(42, 32),
            new THREE.MeshStandardMaterial({ color: 0x7bed9f })
        );
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 牆壁
        const wallRadius = [10, 20, 30];
        const walls = [];
        const wallMatA = new THREE.MeshStandardMaterial({ color: 0xff6b81 });
        const wallMatB = new THREE.MeshStandardMaterial({ color: 0xffffff });

        wallRadius.forEach((r, ringIdx) => {
            const segments = 24;
            const step = (Math.PI * 2) / segments;
            const gaps = [(ringIdx * 3 + 2) % segments, (ringIdx * 5 + 8) % segments];

            for (let i = 0; i < segments; i++) {
                if (gaps.includes(i)) continue;
                const angle = i * step;
                const nextAngle = (i + 1) * step;
                const wall = new THREE.Mesh(
                    new THREE.BoxGeometry(0.6, 3.5, (2 * Math.PI * r) / segments),
                    (i % 2 === 0) ? wallMatA : wallMatB
                );
                const midAngle = (angle + nextAngle) / 2;
                wall.position.set(Math.cos(midAngle) * r, 0, Math.sin(midAngle) * r);
                wall.rotation.y = -midAngle;
                scene.add(wall);
                walls.push(wall);
            }
        });

        // 互動點
        const interactables = [];
        const quizAngles = [0.5, 2.2, 3.8, 4.8, 5.5];
        subList.forEach((sub, i) => {
            const r = wallRadius[i % 3];
            const ang = quizAngles[i];
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(1, 1.2, 0.2),
                new THREE.MeshBasicMaterial({ color: subColorsHex[sub] })
            );
            mesh.position.set(Math.cos(ang) * r, 0.5, Math.sin(ang) * r);
            mesh.userData = { type: 'Q', sub: sub };
            scene.add(mesh);
            interactables.push(mesh);
        });

        const boxAngles = [1.2, 2.9, 4.1, 5.1, 6.0];
        subList.forEach((sub, i) => {
            const r = wallRadius[i % 3] + (i % 2 === 0 ? 4 : -4);
            const ang = boxAngles[i];
            const mesh = new THREE.Mesh(
                new THREE.BoxGeometry(0.8, 0.8, 0.8),
                new THREE.MeshStandardMaterial({ color: subColorsHex[sub] })
            );
            mesh.position.set(Math.cos(ang) * r, 0.4, Math.sin(ang) * r);
            mesh.userData = { type: 'B', sub: sub };
            scene.add(mesh);
            interactables.push(mesh);
        });

        const portal = new THREE.Mesh(
            new THREE.CylinderGeometry(2, 2, 3.5, 16),
            new THREE.MeshBasicMaterial({ color: 0xf1c40f, transparent: true, opacity: 0.6 })
        );
        portal.position.set(0, 0, 0);
        portal.userData = { type: 'E' };
        scene.add(portal);
        interactables.push(portal);

        // 跨平台操作狀態 (電腦 + 手機)
        const inputs = { forward: false, backward: false, left: false, right: false };

        // 1. 電腦鍵盤監聽
        window.addEventListener('keydown', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') inputs.forward = true;
            if (k === 's' || k === 'arrowdown') inputs.backward = true;
            if (k === 'a' || k === 'arrowleft') inputs.left = true;
            if (k === 'd' || k === 'arrowright') inputs.right = true;
        });

        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            if (k === 'w' || k === 'arrowup') inputs.forward = false;
            if (k === 's' || k === 'arrowdown') inputs.backward = false;
            if (k === 'a' || k === 'arrowleft') inputs.left = false;
            if (k === 'd' || k === 'arrowright') inputs.right = false;
        });

        // 2. 手機觸控監聽
        function bindBtn(id, key) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); inputs[key] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); inputs[key] = false; });
            btn.addEventListener('mousedown', () => inputs[key] = true);
            btn.addEventListener('mouseup', () => inputs[key] = false);
        }
        bindBtn('btn-forward', 'forward');
        bindBtn('btn-backward', 'backward');
        bindBtn('btn-left', 'left');
        bindBtn('btn-right', 'right');

        function updatePlayer() {
            if (document.querySelector('.overlay.show')) return;

            // 轉向
            if (inputs.left) playerGroup.rotation.y += 0.04;
            if (inputs.right) playerGroup.rotation.y -= 0.04;

            // 直線前後移動
            let moveDist = 0;
            if (inputs.forward) moveDist -= 0.12;
            if (inputs.backward) moveDist += 0.08;

            if (moveDist !== 0) {
                const moveVec = new THREE.Vector3(0, 0, moveDist).applyAxisAngle(new THREE.Vector3(0, 1, 0), playerGroup.rotation.y);
                let newPos = playerGroup.position.clone().add(moveVec);

                // 牆壁碰撞測試
                let collide = false;
                for (let wall of walls) {
                    if (new THREE.Box3().setFromObject(wall).intersectsBox(new THREE.Box3().setFromCenterAndSize(newPos, new THREE.Vector3(0.8, 1.8, 0.8)))) {
                        collide = true; break;
                    }
                }
                if (!collide) playerGroup.position.copy(newPos);
            }

            // 自動觸發關卡
            interactables.forEach(obj => {
                if (playerGroup.position.distanceTo(obj.position) < 1.4 && !gameState.nearCooldown) {
                    triggerInteraction(obj);
                }
            });
        }

        function triggerInteraction(obj) {
            const data = obj.userData;
            if (data.type === 'Q') {
                gameState.nearCooldown = true;
                const q = quizBank[data.sub][0];
                document.getElementById('quiz-title').textContent = `🎪 闖關：《${data.sub}》`;
                document.getElementById('quiz-text').textContent = q.q;

                const optsEl = document.getElementById('quiz-options');
                optsEl.innerHTML = '';
                q.o.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = 'opt-btn'; btn.textContent = opt;
                    btn.onclick = () => {
                        closeOverlay('quiz-popup');
                        if (idx === q.a) {
                            gameState.keysLit[data.sub] = true;
                            gameState.keyCounts[data.sub]++;
                            updateHUD();
                            scene.remove(obj);
                            showMsg('答對了！', `成功完成【${data.sub}】挑戰！`);
                        } else {
                            showMsg('答錯了', '重新走回去挑戰看看！');
                        }
                        setTimeout(() => gameState.nearCooldown = false, 1500);
                    };
                    optsEl.appendChild(btn);
                });
                showOverlay('quiz-popup');

            } else if (data.type === 'B') {
                if (gameState.keyCounts[data.sub] > 0) {
                    gameState.nearCooldown = true;
                    gameState.keyCounts[data.sub]--;
                    updateHUD();
                    scene.remove(obj);
                    showMsg('拆開禮物！', `🎁 獲得過關提示：自然科答案為 B！`);
                    setTimeout(() => gameState.nearCooldown = false, 1500);
                }
            } else if (data.type === 'E') {
                if (subList.every(s => gameState.keysLit[s])) {
                    showOverlay('cert-popup');
                }
            }
        }

        function updateHUD() {
            subList.forEach(s => {
                const slot = document.getElementById(`hud-${s}`);
                if (gameState.keysLit[s]) slot.classList.add('active');
                slot.querySelector('.key-count').textContent = `x${gameState.keyCounts[s]}`;
            });
        }

        function showOverlay(id) { document.getElementById(id).classList.add('show'); }
        function closeOverlay(id) { document.getElementById(id).classList.remove('show'); }
        function showMsg(title, body) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-body').innerHTML = body;
            showOverlay('msg-popup');
        }

        const minimapCanvas = document.getElementById('minimap-canvas');
        const mctx = minimapCanvas.getContext('2d');

        function renderMinimap() {
            mctx.clearRect(0,0,80,80);
            const cx = 40, cy = 40, scale = 0.85;

            mctx.fillStyle = '#a8e6cf'; mctx.fillRect(0,0,80,80);
            mctx.strokeStyle = '#ff8b94'; mctx.lineWidth = 2;
            wallRadius.forEach(r => {
                mctx.beginPath(); mctx.arc(cx, cy, r * scale, 0, Math.PI * 2); mctx.stroke();
            });

            const px = cx + playerGroup.position.x * scale;
            const py = cy + playerGroup.position.z * scale;
            mctx.fillStyle = '#ff4757';
            mctx.beginPath(); mctx.arc(px, py, 3, 0, Math.PI*2); mctx.fill();
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePlayer();
            renderMinimap();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
